<!-- Boot: applies the saved theme and language BEFORE the first paint, so
     moving between pages never flashes the wrong colours or flips direction.
     Keep it inline and synchronous — an external file would load too late. -->
<script>
(function(){
  try{
    var d = document.documentElement;
    var t = localStorage.getItem('zad-theme') === 'light' ? 'light' : 'dark';
    var l = localStorage.getItem('zad-lang')  === 'en'    ? 'en'    : 'ar';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
    d.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#fdf8fb' : '#07050f');
  }catch(e){ /* private mode: fall back to the markup defaults */ }
})();
</script>

<!-- Watchdog: quiz.html and glossary.html draw their whole contents with
     JavaScript, so if a script fails to load — a blocked CDN, a locked-down
     in-app browser, a dropped connection — the visitor gets a blank page and
     no idea why. This inline block is the only code guaranteed to run, so it
     watches the container and puts a readable message there instead.
     It cancels itself as soon as real content appears. -->
<script>
(function(){
  var TARGET = '#quiz-app';
  var failed = null;
  window.addEventListener('error', function (e) {
    if (!failed) failed = (e && e.message) || 'script error';
  }, true);

  function rescue(){
    var host = document.querySelector(TARGET);
    if (!host) return;
    // real content rendered? then there is nothing to do
    if (host.querySelector('section, article, .gloss-card, .pq-card, .run')) return;

    var ar = document.documentElement.getAttribute('lang') !== 'en';
    host.innerHTML =
      '<div style="max-width:520px;margin:14vh auto;padding:26px;text-align:center;' +
      'font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#cfc7ea">' +
      '<h1 style="font-size:20px;margin-bottom:12px;color:#fff">' +
      (ar ? 'تعذّر تحميل هذه الصفحة' : 'This page could not load') + '</h1>' +
      '<p style="font-size:14px;line-height:1.9;margin-bottom:18px">' +
      (ar ? 'بعض المتصفحات داخل التطبيقات (فيسبوك، إنستغرام) تمنع تحميل ملفات الصفحة. افتح الرابط في متصفحك العادي.'
          : 'Some in-app browsers (Facebook, Instagram) block the files this page needs. Open the link in your normal browser.') +
      '</p>' +
      '<p style="margin-bottom:18px"><a href="index.html" style="color:#c4b5fd;font-weight:700">' +
      (ar ? 'العودة للرئيسية' : 'Back to home') + '</a></p>' +
      '<button onclick="location.reload()" style="padding:11px 22px;border-radius:12px;border:0;' +
      'background:#7c3aed;color:#fff;font-weight:700;cursor:pointer">' +
      (ar ? 'أعد المحاولة' : 'Try again') + '</button>' +
      (failed ? '<p style="margin-top:20px;font-size:11px;color:#6f6690;font-family:monospace;' +
                'word-break:break-all">' + String(failed).slice(0, 200) + '</p>' : '') +
      '</div>';
  }

  // give the scripts a fair chance on a slow connection first
  window.addEventListener('load', function () { setTimeout(rescue, 2500); });
  setTimeout(rescue, 8000);
})();
</script>
