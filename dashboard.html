<!-- Boot: applies the saved theme and language BEFORE the first paint, so
     moving between pages never flashes the wrong colours or flips direction.
     Keep it inline and synchronous — an external file would load too late. -->
<script>
(function(){
  try{
    var d = document.documentElement;
    var t = localStorage.getItem('zad-theme') === 'light' ? 'light' : 'dark';
    var l = localStorage.getItem('zad-lang')  === 'en'    ? 'en'    : 'ar';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
    d.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#fdf8fb' : '#07050f');
  }catch(e){ /* private mode: fall back to the markup defaults */ }
})();
</script>

<!-- ==================== LOADING ==================== -->
<div class="dash" id="dash-loading">
  <div class="dash-head">
    <div class="skeleton" style="inline-size:74px;block-size:74px;border-radius:22px"></div>
    <div style="flex:1">
      <div class="skeleton" style="block-size:24px;max-inline-size:240px;margin-block-end:10px"></div>
      <div class="skeleton" style="block-size:14px;max-inline-size:340px"></div>
    </div>
  </div>
  <div class="stat-row">
    <div class="skeleton" style="block-size:96px"></div>
    <div class="skeleton" style="block-size:96px"></div>
    <div class="skeleton" style="block-size:96px"></div>
    <div class="skeleton" style="block-size:96px"></div>
  </div>
</div>

<!-- ==================== SIGNED OUT ==================== -->
<div class="dash" id="dash-guest" hidden>
  <div class="card edge-glow text-center" style="max-inline-size:520px;margin-inline:auto;margin-block-start:8vh">
    <div class="major-icon" style="--accent:var(--p-400);margin-inline:auto;margin-block-end:18px" id="guest-icon"></div>
    <h2 style="font-size:22px;margin-block-end:10px" data-i18n="dash_guest_t"></h2>

    <div style="display:flex;gap:11px;justify-content:center;flex-wrap:wrap">
      <a class="btn btn-primary" href="signin.html"><span data-i18n="nav_signin"></span></a>
      <a class="btn btn-ghost" href="index.html"><span data-i18n="nav_home"></span></a>
    </div>
  </div>
</div>

<!-- ==================== DASHBOARD ==================== -->
<main class="dash" id="dash-main" hidden>

  <section class="dash-head reveal">
    <div class="avatar" id="dash-avatar">?</div>
    <div style="flex:1;min-inline-size:220px">
      <h1><span data-i18n="dash_hi"></span> <span id="dash-name"></span></h1>
      <div class="who" id="dash-email"></div>
      <div class="who-tags" id="dash-tags"></div>
    </div>
  </section>

  <section class="stat-row">
    <div class="stat-card reveal" data-delay="1">
      <div class="k" data-i18n="dash_saved"></div>
      <div class="v" id="kpi-saved">0</div>
    </div>
    <div class="stat-card reveal" data-delay="2">
      <div class="k" data-i18n="dash_progress"></div>
      <div class="v"><span id="kpi-progress">0</span><small>%</small></div>
    </div>
    <div class="stat-card reveal" data-delay="3">
      <div class="k" data-i18n="dash_done"></div>
      <div class="v" id="kpi-done">0</div>
    </div>
    <div class="stat-card reveal" data-delay="4">
      <div class="k" data-i18n="dash_available"></div>
      <div class="v" id="kpi-pathway">0</div>
    </div>
  </section>

  <div class="dash-grid">
    <div style="display:flex;flex-direction:column;gap:20px">

      <!-- deadlines -->
      <section class="panel reveal">
        <div class="panel-head">
          <h3 data-i18n="dash_deadlines"></h3>
          <span class="tag" id="deadline-count"></span>
        </div>
        <div class="panel-body" id="deadline-list"></div>
      </section>

      <!-- quiz mastery -->
      <section class="panel reveal">
        <div class="panel-head">
          <h3 data-i18n="dash_mastery"></h3>
          <a class="btn btn-soft btn-sm" href="quiz.html"><span data-i18n="dash_take_quiz"></span></a>
        </div>
        <div class="panel-body" id="mastery-list"></div>
      </section>

      <!-- study plan -->
      <section class="panel reveal">
        <div class="panel-head"><h3 data-i18n="plan_title"></h3></div>
        <div class="panel-body">
          <p class="panel-lede" data-i18n="plan_sub"></p>
          <div class="field-row">
            <div class="field">
              <label for="plan-date" data-i18n="plan_date"></label>
              <input class="input" type="date" id="plan-date">
            </div>
            <div class="field">
              <label for="plan-major" data-i18n="f_major"></label>
              <select class="select" id="plan-major"></select>
            </div>
          </div>
          <div class="field">
            <label for="plan-hours" data-i18n="plan_hours"></label>
            <input class="input" type="number" id="plan-hours" min="1" max="40" value="6">
          </div>
          <button class="btn btn-primary btn-block" type="button" id="plan-make">
            <span data-i18n="plan_make"></span>
          </button>
          <div id="plan-out"></div>
        </div>
      </section>

      <!-- saved units -->
      <section class="panel reveal">
        <div class="panel-head">
          <h3 data-i18n="dash_my_saved"></h3>
          <a class="btn btn-soft btn-sm" href="index.html#courses"><span data-i18n="dash_browse"></span></a>
        </div>
        <div class="panel-body" id="saved-list"></div>
      </section>

      <!-- progress -->
      <section class="panel reveal">
        <div class="panel-head"><h3 data-i18n="dash_my_prog"></h3></div>
        <div class="panel-body" id="progress-list"></div>
      </section>

      <!-- recommended -->
      <section class="panel reveal">
        <div class="panel-head"><h3 data-i18n="dash_recommend"></h3></div>
        <div class="panel-body" id="reco-list"></div>
      </section>
    </div>

    <aside style="display:flex;flex-direction:column;gap:20px">

    <!-- share card -->
    <section class="panel reveal">
      <div class="panel-head"><h3 data-i18n="share_title"></h3></div>
      <div class="panel-body">
        <p class="panel-lede" data-i18n="share_sub"></p>
        <canvas id="share-canvas" width="1000" height="560" class="share-canvas"></canvas>
        <button class="btn btn-primary btn-block" type="button" id="share-dl">
          <span data-i18n="share_dl"></span>
        </button>
      </div>
    </section>

    <!-- classes -->
    <section class="panel reveal">
      <div class="panel-head"><h3 data-i18n="class_title"></h3></div>
      <div class="panel-body" id="class-body"></div>
    </section>

    <!-- profile -->
    <section class="panel reveal" data-delay="2">
      <div class="panel-head"><h3 data-i18n="dash_profile"></h3></div>
      <div class="panel-body">
        <form id="profile-form" novalidate>
          <div class="field">
            <label for="pf-name" data-i18n="f_fullname"></label>
            <input class="input" type="text" id="pf-name" data-i18n-attr="placeholder:f_fullname_p">
          </div>
          <div class="field">
            <label for="pf-username" data-i18n="f_username"></label>
            <input class="input" type="text" id="pf-username" data-i18n-attr="placeholder:f_username_p">
          </div>
          <div class="field">
            <label for="pf-major" data-i18n="f_major"></label>
            <select class="select" id="pf-major"></select>
          </div>
          <div class="field">
            <label for="pf-level" data-i18n="f_level"></label>
            <select class="select" id="pf-level"></select>
          </div>
          <div class="field">
            <label for="pf-year" data-i18n="f_year"></label>
            <select class="select" id="pf-year"></select>
          </div>
          <div class="field">
            <label for="pf-school" data-i18n="f_school"></label>
            <input class="input" type="text" id="pf-school" data-i18n-attr="placeholder:f_school_p">
          </div>
          <div class="field">
            <label for="pf-country" data-i18n="f_country"></label>
            <select class="select" id="pf-country"></select>
          </div>
          <div class="field">
            <label data-i18n="f_interests"></label>
            <div class="chip-select" id="pf-interests"></div>
          </div>
          <div class="field">
            <label for="pf-bio" data-i18n="f_bio"></label>
            <textarea class="textarea" id="pf-bio" maxlength="400"></textarea>
          </div>

          <div class="field">
            <label for="pf-display" data-i18n="f_display"></label>
            <input class="input" type="text" id="pf-display" maxlength="24"
                   data-i18n-attr="placeholder:f_display_p">
            <span class="hint" data-i18n="f_display_hint"></span>
          </div>
          <label class="switch-row">
            <input type="checkbox" id="pf-leaderboard">
            <span data-i18n="f_leaderboard"></span>
          </label>

          <button class="btn btn-primary btn-block" type="submit" id="pf-submit">
            <span data-i18n="btn_save"></span>
          </button>
        </form>
      </div>
    </section>
    </aside>
  </div>
</main>
