<!-- Boot: applies the saved theme and language BEFORE the first paint, so
     moving between pages never flashes the wrong colours or flips direction.
     Keep it inline and synchronous — an external file would load too late. -->
<script>
(function(){
  try{
    var d = document.documentElement;
    var t = localStorage.getItem('zad-theme') === 'light' ? 'light' : 'dark';
    var l = localStorage.getItem('zad-lang')  === 'en'    ? 'en'    : 'ar';
    d.setAttribute('data-theme', t);
    d.setAttribute('lang', l);
    d.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'light' ? '#fdf8fb' : '#07050f');
  }catch(e){ /* private mode: fall back to the markup defaults */ }
})();
</script>
